<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الحجز - فندق البستان</title>
  <link rel="stylesheet" href="../CSS/styl.css">
  <link rel="stylesheet" href="../JavaScript/script.js">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

  <!-- رأس الصفحة -->
  <header>
    <nav class="navbar">
      <div class="logo">🌸 فندق البستان</div>
      <ul>
        <li><a href="index.html">الرئيسية</a></li>
        <li><a href="about.html">عن الفندق</a></li>
        <li><a href="rooms.html">الغرف</a></li>
        <li><a href="services.html">الخدمات</a></li>
        <li><a href="offer.html">العروض</a></li>
        <li><a href="location.html">الموقع</a></li>
        <li><a href="booking.html" class="active">الحجز</a></li>
      </ul>
    </nav>
  </header>

  <!-- محتوى الصفحة -->
  <section class="booking">
    <h2>استمارة الحجز</h2>
    <p>املأ البيانات أدناه لتأكيد حجزك 🌸</p>

    <form class="booking-form" enctype="multipart/form-data">
      <label>الاسم الكامل</label>
      <input type="text" name="fullname" placeholder="أدخل اسمك الكامل" required>

      <label>رقم الهاتف</label>
      <input type="tel" name="phone" placeholder="أدخل رقم الهاتف" required>

      <label>صورة البطاقة</label>
      <input type="file" name="idcard" accept="image/*" required>

      <label>تسجيل الدخول (اختياري)</label>
      <input type="email" name="email" placeholder="البريد الإلكتروني">

      <button type="submit" class="btn">إرسال الحجز</button>
    </form>
  </section>

  <!-- ذيل الصفحة -->
  <footer>
    <p>© 2025 جميع الحقوق محفوظة - فندق البستان</p>

      <a href="#"><i class="fa-brands fa-instagram"></i></a>
      <a href="#"><i class="fa-brands fa-twitter"></i></a>
    </p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
